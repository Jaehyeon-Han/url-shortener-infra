# .github/workflows/cicd.yml (참고용 — 코드(핸들러) 레포에 둔다)
#
# 기존 워크플로의 deploy 잡 "배포 경로"만 교체한 버전이다.
# detect-changes / gate / 핸들러 테스트 부분은 기존과 동일하므로 생략한다.
#
# 비동기 드레이너 전환 핵심:
#   - 기존 "update-function-code --publish + CodeDeploy 트리거"를 scripts/deploy.mjs(enqueue-only)로 교체한다.
#   - CI는 CodeDeploy를 직접 호출하지 않는다. S3 업로드 + 버전 publish 후 DeployQueue에
#     desiredVersion만 enqueue하고 즉시 종료한다.
#   - 실제 배포 직렬화·트래픽 전환·알람 갱신(url ExecutedVersion)·자동 롤백은 드레이너 Lambda와
#     CodeDeploy가 수행한다. 배포가 겹쳐도 드레이너가 큐로 직렬화하므로 DeploymentLimitExceeded가 없다.
#   - 설계 전체는 인프라 레포의 async-deploy-drainer.md 참조.
#
# 에러 지표(중요): 핸들러가 try/catch로 500을 정상 리턴하는 구조라 AWS/Lambda Errors가 0이다.
#   그래서 핸들러가 PutMetricData로 커스텀 메트릭(UrlShortener/App HandlerErrors)을 발행하고
#   (ci-reference/handler-metric.mjs 참고), 롤백 알람은 그 지표를 본다. 알람 "갱신"은 드레이너가 한다.
#
# GitHub 변수(vars)/시크릿:
#   vars.LAMBDA_DEPLOY_MAP       핸들러->배포 설정 매핑(JSON, enqueue-only). `terraform output -raw lambda_deploy_map`로 생성.
#   vars.DEPLOY_QUEUE_TABLE      DeployQueue 테이블명. `terraform output -raw deploy_queue_table_name`로 생성.
#   vars.LAMBDA_ARTIFACT_BUCKET  아티팩트 버킷.
#   vars.AWS_REGION              리전.
#   secrets.AWS_DEPLOY_ROLE_ARN  OIDC assume 역할.
#
# ── 권한은 "세 역할"로 나뉜다 (혼동 주의) ──
#
# (1) CI 배포 역할 (GitHub OIDC로 assume): deploy.mjs(enqueue-only)가 호출하는 권한
#     lambda:UpdateFunctionCode, lambda:PublishVersion,
#     dynamodb:UpdateItem (DeployQueue 한정),
#     s3:PutObject.
#     → 비동기 전환으로 codedeploy:*·cloudwatch:PutMetricAlarm·lambda:GetAlias는 제거했다
#       (그 권한은 드레이너 역할로 이동). lambda:UpdateAlias는 원래부터 불필요(CodeDeploy 서비스 역할이 수행).
#
# (2) 함수 "실행 역할" (Lambda가 런타임에 사용): 핸들러가 커스텀 메트릭을 발행하는 권한
#     cloudwatch:PutMetricData → modules/lambda의 실행 역할에 부여(인프라 레포 쪽).
#
# (3) 드레이너 역할 (드레이너 Lambda가 사용): codedeploy 배포·lambda:GetAlias·PutMetricAlarm·
#     DeployQueue item/stream → modules/deploy-drainer가 부여(인프라 레포 쪽).

# --- deploy 잡의 배포 경로 스텝(핸들러 테스트 이후)만 발췌 ---

      - name: Package function (src transitive closure only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package.mjs "${{ matrix.handler }}"
          ls -l "dist/${{ matrix.handler }}/function.zip"

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "dist/${{ matrix.handler }}/function.zip" \
            "s3://${BUCKET}/${{ matrix.handler }}/function.zip"

      # 코드 갱신 + 버전 publish + DeployQueue enqueue를 한 스크립트로 처리(비블로킹).
      # 실제 배포는 드레이너가 큐를 소비해 수행한다.
      - name: Enqueue desired version (async drainer)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_MAP: ${{ vars.LAMBDA_DEPLOY_MAP }}
          DEPLOY_QUEUE_TABLE: ${{ vars.DEPLOY_QUEUE_TABLE }}
          BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          HANDLER: ${{ matrix.handler }}
        run: node scripts/deploy.mjs "$HANDLER"
